name: Dependabot NuGet lockfile autofix

# Dependabot NuGet PRs can occasionally regenerate multi-TFM packages.lock.json files
# with only one target framework. This privileged pull_request_target workflow is
# intentionally limited to same-repository Dependabot NuGet branches, validates that
# the PR only touches central package metadata / lock files, then runs the repository
# restore command and commits lock-file-only corrections back to the PR branch.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - Directory.Packages.props
      - '**/packages.lock.json'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-lockfile-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix-lockfiles:
    name: autofix-lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/nuget/')
    steps:
      - name: Validate Dependabot NuGet PR scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          files="$(gh pr diff "$PR_URL" --name-only)"
          echo "Changed files:"
          printf '%s\n' "$files"

          invalid_files="$(printf '%s\n' "$files" | awk '$0 != "Directory.Packages.props" && $0 !~ /(^|\/)packages\.lock\.json$/ { print }')"
          if [ -n "$invalid_files" ]; then
            echo "::error::Dependabot NuGet lockfile autofix is limited to Directory.Packages.props and packages.lock.json changes."
            printf '%s\n' "$invalid_files"
            exit 1
          fi

      - name: Checkout Dependabot branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Setup .NET (net8 runtime + pinned SDK)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Regenerate NuGet lock files
        run: dotnet restore DeltaSharp.sln --force-evaluate

      - name: Detect lock-file-only changes
        id: lockfiles
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only)"
          if [ -z "$changed_files" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No lock file corrections needed."
            exit 0
          fi

          non_lock_files="$(printf '%s\n' "$changed_files" | grep -Ev '(^|/)packages\.lock\.json$' || true)"
          if [ -n "$non_lock_files" ]; then
            echo "::error::Restore changed files other than packages.lock.json; refusing to commit."
            printf '%s\n' "$non_lock_files"
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Corrected lock files:"
          printf '%s\n' "$changed_files"

      - name: Commit and push corrected lock files
        if: steps.lockfiles.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ':(glob)**/packages.lock.json'
          git diff --cached --quiet && { echo "No staged lock file changes."; exit 0; }
          git commit -s -m "ci: regenerate Dependabot NuGet lock files"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${HEAD_REF}"
