name: Reconcile

# Governance reconciliation gate (STORY-00.6.2, #452). A lightweight, build-free check that
# fails when the persona roster, the GitHub label taxonomy, CODEOWNERS, and the
# feature-request milestone dropdown drift out of the manual reconciliation recorded in
# docs/planning/label-taxonomy.md (#449). It runs three reconciliations plus three local
# validations (settings-permissions, command-skill-frontmatter, tracked-startup-config):
#   * roster<->labels    — every .claude/agents/*.md wrapper has a persona:<slug> label
#                          and vice-versa (allowing the ONE documented 50-char truncation),
#                          reconciled against the committed label list AND the live labels.
#                          Wrapper front matter is policed too: permissionMode may only be
#                          default/plan, and hooks/mcpServers/isolation/env (or any unknown
#                          key) are rejected — Claude Code reads them as runtime config.
#   * codeowners-errors  — GET /repos/{repo}/codeowners/errors?ref=<PR head> reports no
#                          parse/owner errors (pinned to the PR head so a breaking PR fails).
#   * milestone-dropdown — the feature_request.yml milestone options match the live GitHub
#                          milestones (plus the documented "needs triage" sentinel).
#   * settings-permissions (a VALIDATION, not a reconciliation) — .claude/settings.json stays
#                          parseable and permissions.allow/deny stay LISTS of plain strings.
#                          The file is a positive ALLOWLIST: only `$schema`, `permissions`
#                          and the listed inert keys may appear at top level, and
#                          `permissions` may hold only allow/deny/defaultMode — so every
#                          executable-valued key (`hooks`, `env`, `apiKeyHelper`,
#                          `statusLine`, the AWS/GCP/proxy helpers, ...) and
#                          permissions.additionalDirectories are rejected by name, and any
#                          defaultMode outside default/plan is rejected (bypassPermissions/
#                          dontAsk skip every prompt; acceptEdits auto-approves writes).
#                          In `allow` it rejects the enumerated mutating git/gh
#                          prefixes in FORBIDDEN_ALLOW_COMMANDS (`gh api`, `git push`,
#                          `gh pr merge`, ... compared CASE-INSENSITIVELY, including
#                          via a broad `Bash(gh:*)`)
#                          and any wildcard or TOOL-WIDE Bash grant (`Bash`, `Bash()`,
#                          `Bash(*)`, `Bash(gh *)` — an unescaped `*` is matched as a GLOB),
#                          and it requires all 14 REQUIRED_DENY_ENTRIES to be present. Allow
#                          entries outside those rules are NOT policed — the check bounds
#                          the file's blast radius,
#                          it does not certify the whole permission surface. Implemented in
#                          tools/reconcile/roster-labels.py (validate_settings), so it is
#                          self-tested and mutation-checked like the reconciliations above.
#   * command-skill-frontmatter (also a VALIDATION) — the THIRD front-matter surface Claude
#                          Code reads as runtime configuration: .claude/commands/**/*.md
#                          slash commands and .claude/skills/**/SKILL.md manifests. A tracked
#                          command file carrying `allowed-tools: Bash(<cmd>:*)` RUNS that
#                          command with no permission prompt, invisible to both the settings
#                          and the wrapper policies above, so `allowed-tools`,
#                          `permissionMode`, `hooks`, `mcpServers`, `env` and `isolation` are
#                          rejected by name and any key outside description/argument-hint/
#                          model (plus `name` for skills) is rejected on sight. Front matter
#                          is read by the same STRICT reader, so an unparseable fence fails
#                          rather than being skipped; .claude/commands is optional but a
#                          skills tree with zero manifests FAILS, and the passing report
#                          states how many files were scanned. SYMLINKS are rejected and the
#                          rule is decided BY GIT: any tracked symlink under .claude/ (or at
#                          .mcp.json / settings.local.json / settings.json) fails on its index
#                          mode 120000, so a DANGLING link cannot hide — one pointing at bin/
#                          or obj/ is absent in this checkout-only job yet resolves to real
#                          config wherever the target exists. The walks also report any link
#                          they see (roots included, whatever the file is named); links are
#                          never followed, so a link loop cannot hang the gate.
#   * tracked-startup-config (also a VALIDATION) — the two startup surfaces
#                          settings-permissions never opens: a repo-root `.mcp.json` (each
#                          `mcpServers[*].command` is SPAWNED when the CLI launches, with no
#                          prompt) and `.claude/settings.local.json` (honoured like
#                          settings.json, and where every remedy message here sends
#                          per-machine grants — safe only while it is untracked). Only a
#                          TRACKED file fails (`git ls-files --error-unmatch`), so an
#                          untracked local copy is reported, not failed; a tracked malformed
#                          .mcp.json fails, an empty `mcpServers` passes, and a tracked
#                          SYMLINK at either path (or at .claude/settings.json) fails on its
#                          git mode 120000 even when it dangles here. If git cannot say,
#                          the check reports SKIP and --require-remote makes that exit 2.
#
# It runs on PRs and pushes that touch the governance files (drift introduced by a code
# change), on a weekly schedule and on demand (drift introduced GitHub-side, e.g. a label or
# milestone renamed in the UI, which is not a file change). The gate is intentionally NOT a
# branch-protection required check today (it can be promoted post-merge like the other gates,
# see label-taxonomy.md). Least-privilege read-only token; the one action is pinned by SHA.
on:
  push:
    branches: [main]
    paths:
      - ".claude/agents/**"
      - ".claude/commands/**"
      - ".claude/skills/**"
      - ".claude/settings.json"
      - ".claude/settings.local.json"
      - ".mcp.json"
      - ".github/ISSUE_TEMPLATE/feature_request.yml"
      - ".github/CODEOWNERS"
      - "docs/planning/label-taxonomy.md"
      - ".github/workflows/reconcile.yml"
      - "tools/reconcile/**"
  pull_request:
    branches: [main]
    paths:
      - ".claude/agents/**"
      - ".claude/commands/**"
      - ".claude/skills/**"
      - ".claude/settings.json"
      - ".claude/settings.local.json"
      - ".mcp.json"
      - ".github/ISSUE_TEMPLATE/feature_request.yml"
      - ".github/CODEOWNERS"
      - "docs/planning/label-taxonomy.md"
      - ".github/workflows/reconcile.yml"
      - "tools/reconcile/**"
  schedule:
    # Weekly, Mondays ~07:17 UTC — catch GitHub-side drift (a label/milestone edited in the
    # UI) that no file change would otherwise trigger.
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    name: reconcile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Prove the gate's own reconciliation logic (truncation, dropdown parse, milestone and
      # label diffing) with in-memory fixtures before trusting it on live data — mirrors the
      # coverage and SCA gate self-tests. Stdlib-only Python; nothing to install.
      - name: Reconcile gate self-test
        run: python3 tools/reconcile/roster-labels.py --selftest

      # .claude/settings.json is a security-relevant permission surface (an over-broad allow
      # entry silently widens what runs without a prompt), so it is validated here too. The
      # rules live in the gate script (validate_settings) rather than in an inline one-liner,
      # so they are covered by --selftest above and cannot rot unnoticed. Local + stdlib-only;
      # runs before the live checks so a malformed permission file fails fast.
      - name: Validate .claude/settings.json
        run: python3 tools/reconcile/roster-labels.py --validate-settings-only

      # The live checks read public repo metadata (labels, milestones, codeowners/errors) via
      # the GitHub CLI using the default read-only token. --require-remote makes a lookup that
      # could not run a hard failure (exit 2 — the gate COULD NOT VERIFY: a remote outage, a
      # missing/empty .claude/agents directory, OR a local check that could not verify its
      # input (environment — run the gate inside the git checkout)) so the gate cannot silently
      # pass without verifying. Each cause prints its own message, because they need different
      # fixes: wait out an outage, fix the repo, or fix the environment the gate ran in.
      # Exit 1 is DRIFT to fix in the repo, and that includes roster INTEGRITY
      # problems (nested, unparseable or nameless wrappers) even when they leave the roster
      # empty — an author-fixable repo state must never page as an outage. --ref pins the
      # CODEOWNERS validation to the PR head/merge commit (github.sha) so a PR that breaks
      # CODEOWNERS fails the PR gate rather than only being caught post-merge on main.
      - name: Reconcile roster, labels, CODEOWNERS, milestones
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/reconcile/roster-labels.py
          --repo "${{ github.repository }}"
          --ref "${{ github.sha }}"
          --require-remote
